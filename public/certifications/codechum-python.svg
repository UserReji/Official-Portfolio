<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#g)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <g transform="translate(400,200)">
    <circle r="80" fill="rgba(255,255,255,0.15)"/>
    <!-- Python snake icon simplified -->
    <text x="0" y="12" text-anchor="middle" fill="white" font-family="system-ui" font-size="52" font-weight="700">🐍</text>
  </g>
  <text x="400" y="320" text-anchor="middle" fill="white" font-family="system-ui" font-size="22" font-weight="700">CodeChum</text>
  <text x="400" y="350" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-family="system-ui" font-size="14">IT Elective 3 — Python</text>
</svg>
